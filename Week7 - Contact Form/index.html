<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form action="#" method="POST">

        <h2>Contact Form</h2>

        <div>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Gary Lineker" required>

        </div>

        <div>
           <label for="email">Email Address:</label>
           <input type="email" id="email" name="email" placeholder="garygeld@gamil.de" required> 

        </div>

        <div>
            <label for="phone">Phone Number:</label>
            <input type="number" id="phone" name="phone" placeholder="+4426888888" minlength="10 digits" required>

        </div>

        <div>
           <label for="msg">Message:</label>
           <textarea name="msg" id="msg" rows="4">Any other message...</textarea> 

        </div>


        <button type="submit">Send</button>



    </form>
</body>
</html>
